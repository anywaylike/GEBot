[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gebot"
version = "0.1.0"
description = "Graph evidence for large language model-based social bot detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.23",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.2",
    "torch>=2.0",
    "tqdm>=4.65",
    "transformers>=4.38",
    "zhipuai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gebot-eval = "graphreason_bot.evaluation:main"
gebot-prepare-cohort = "graphreason_bot.prepare_cohort:main"
graphreason-eval = "graphreason_bot.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
